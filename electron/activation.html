<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' file:; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <title>Freedom · 账号访问</title>
    <style>
    :root {
      /* 与主界面 frontend/styles/tokens.css 的暗色主题同一套取值 */
      --bg: oklch(0.235 0 0);
      --bg-2: oklch(0.215 0 0);
      --surface: oklch(0.285 0 0);
      --surface-2: oklch(0.305 0 0);
      --surface-3: oklch(0.335 0 0);
      --line: oklch(1 0 0 / 10%);
      --line-strong: oklch(1 0 0 / 17%);
      --ink: oklch(0.965 0 0);
      --ink-soft: oklch(0.9 0 0);
      --muted: oklch(0.78 0 0);
      --muted-2: oklch(0.62 0 0);
      --primary: oklch(0.54 0.142 248.516);
      --primary-hot: oklch(0.66 0.15 248.516);
      --primary-ink: oklch(1 0 0);
      --ok: oklch(0.696 0.17 162.48);
      --danger: oklch(0.704 0.191 22.216);
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { color: var(--ink); background: var(--bg); font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; user-select: none; letter-spacing: 0; }
    button, input { font: inherit; letter-spacing: 0; }
    button { cursor: pointer; }
    .shell { position: relative; width: 100%; height: 100%; border: 1px solid var(--line-strong); background: var(--bg); }
    .drag-region { -webkit-app-region: drag; position: absolute; z-index: 20; top: 0; right: 138px; left: 0; height: 36px; }
    .stage { position: relative; width: 100%; height: 100%; min-height: 0; overflow: hidden; isolation: isolate; background: var(--bg); }
    /* 背景只有极淡的主色光晕：没有插画、没有角色立绘 */
    .backdrop {
      position: absolute; z-index: -4; inset: -6%;
      transform: translate(var(--shift-x, 0px), var(--shift-y, 0px));
      background:
        radial-gradient(760px 480px at 10% 2%, color-mix(in oklch, var(--primary) 24%, transparent), transparent 70%),
        radial-gradient(640px 440px at 90% 98%, color-mix(in oklch, var(--primary) 14%, transparent), transparent 72%),
        var(--bg);
      transition: transform .4s ease-out;
    }
    .scene-grade { position: absolute; z-index: -3; inset: 0; pointer-events: none; background: linear-gradient(180deg, oklch(1 0 0 / 3%), transparent 42%); }
    .brand-zone { position: absolute; z-index: 1; left: clamp(48px, 7vw, 96px); top: 50%; transform: translateY(-50%); max-width: 46%; }
    .brand-lockup { display: flex; align-items: center; gap: 14px; }
    .brand-mark { width: 46px; height: 46px; display: grid; place-items: center; border: 1px solid var(--line-strong); border-radius: 12px; color: var(--primary-hot); background: var(--surface); }
    .brand-mark svg { width: 24px; height: 24px; }
    .brand-name { color: var(--ink); font-size: 22px; font-weight: 700; }
    .brand-tagline { margin: 20px 0 0; color: var(--muted); font-size: 13px; line-height: 1.8; }
    .brand-note { margin: 10px 0 0; color: var(--muted-2); font-size: 12px; }
    .auth-panel { position: absolute; z-index: 5; top: 50%; right: clamp(34px, 6vw, 82px); width: min(430px, calc(100% - 72px)); max-height: calc(100% - 48px); transform: translateY(-50%); overflow: hidden; padding: 30px 34px 25px; border: 1px solid var(--line-strong); border-radius: 16px; background: var(--surface); box-shadow: 0 1px 2px oklch(0 0 0 / 34%); }
    .auth-panel::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--primary); }
    .panel-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; margin-bottom: 21px; }
    .panel-kicker { display: flex; align-items: center; gap: 7px; color: var(--muted-2); font: 800 10px Consolas, "Courier New", monospace; letter-spacing: .12em; }
    .panel-kicker::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--primary); }
    .mode-title { margin: 7px 0 0; color: var(--ink); font-size: 30px; line-height: 1; font-weight: 720; }
    .mode-copy { margin-top: 9px; color: var(--muted); font-size: 12px; }
    .tabs { flex: 0 0 auto; display: grid; grid-template-columns: repeat(2, 1fr); width: 150px; height: 37px; padding: 3px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); }
    .tab { border: 0; border-radius: 9px; color: var(--muted); background: transparent; font-size: 12px; font-weight: 700; transition: color .15s, background .15s; }
    .tab:hover { color: var(--ink); background: var(--surface-3); }
    .tab.active { color: var(--primary-ink); background: var(--primary); }
    .form { display: grid; gap: 13px; }
    .field { display: block; min-width: 0; }
    .field-line { display: flex; align-items: center; justify-content: space-between; margin-bottom: 7px; }
    .field-label { color: var(--ink-soft); font-size: 12px; font-weight: 600; }
    .field-index { color: var(--muted-2); font: 700 8px Consolas, "Courier New", monospace; letter-spacing: .1em; }
    .input-wrap { position: relative; display: block; }
    .input { width: 100%; height: 47px; padding: 0 14px; border: 0; border-radius: 10px; outline: none; color: var(--ink); background: var(--surface-2); box-shadow: 0 0 0 1px var(--line-strong) inset; font-size: 13px; user-select: text; caret-color: var(--primary-hot); transition: box-shadow .18s; }
    .input::placeholder { color: var(--muted-2); }
    .input:hover { box-shadow: 0 0 0 1px oklch(1 0 0 / 26%) inset; }
    .input:focus { box-shadow: 0 0 0 1px var(--primary) inset, 0 0 0 3px color-mix(in oklch, var(--primary) 26%, transparent); }
    .input.password { padding-right: 55px; }
    .input:disabled { color: var(--muted-2); background: var(--bg-2); }
    .reveal { position: absolute; top: 8px; right: 8px; height: 31px; min-width: 41px; padding: 0 8px; border: 1px solid var(--line); border-radius: 8px; color: var(--muted); background: var(--surface-3); font-size: 11px; font-weight: 700; }
    .reveal:hover { color: var(--ink); border-color: var(--line-strong); }
    .session-row { display: flex; align-items: center; gap: 8px; min-height: 19px; color: var(--muted); font-size: 11px; }
    .session-check { width: 16px; height: 16px; display: grid; place-items: center; border: 1px solid color-mix(in oklch, var(--ok) 46%, transparent); border-radius: 5px; color: var(--ok); background: color-mix(in oklch, var(--ok) 12%, transparent); font-size: 10px; font-weight: 900; }
    .session-note { margin-left: auto; color: var(--muted-2); }
    .submit { position: relative; width: 100%; height: 48px; border: 0; border-radius: 10px; color: var(--primary-ink); background: var(--primary); font-size: 13px; font-weight: 750; box-shadow: 0 8px 18px color-mix(in oklch, var(--primary) 22%, transparent); transition: background .15s, box-shadow .18s, transform .14s; }
    .submit:hover { background: var(--primary-hot); box-shadow: 0 10px 24px color-mix(in oklch, var(--primary) 32%, transparent); }
    .submit:active { transform: scale(.985); }
    .submit:disabled { opacity: .55; cursor: wait; transform: none; }
    .message { min-height: 40px; max-height: 54px; display: flex; align-items: center; overflow: auto; padding: 9px 12px; border: 1px solid var(--line); border-left: 2px solid var(--primary); border-radius: 8px; color: var(--ink-soft); background: var(--surface-2); font-size: 11.5px; line-height: 1.55; }
    .message.ok { border-left-color: var(--ok); color: var(--ok); background: color-mix(in oklch, var(--ok) 10%, var(--surface-2)); }
    .message.err { border-left-color: var(--danger); color: var(--danger); background: color-mix(in oklch, var(--danger) 10%, var(--surface-2)); }
    .panel-footer { display: flex; align-items: center; gap: 9px; margin-top: 15px; padding-top: 12px; border-top: 1px solid var(--line); color: var(--muted-2); font: 700 9px Consolas, "Courier New", monospace; letter-spacing: .06em; }
    .footer-state { margin-left: auto; color: var(--muted); white-space: nowrap; }
    .update-action { min-height: 24px; padding: 0 9px; border: 1px solid var(--line); border-radius: 7px; color: var(--muted); background: var(--surface-2); font-size: 10px; font-weight: 700; }
    .update-action:hover { color: var(--ink); border-color: var(--line-strong); }
    .update-action:disabled { cursor: wait; opacity: .62; }
    .hidden { display: none !important; }
    .registering .auth-panel { padding: 25px 34px 18px; }
    .registering .panel-head { margin-bottom: 12px; }
    .registering .form { gap: 8px; }
    .registering .input { height: 41px; }
    .registering .field-line { margin-bottom: 4px; }
    .registering .reveal { top: 6px; height: 29px; }
    .registering .session-row { display: none; }
    .registering .submit { height: 43px; }
    .registering .message { min-height: 32px; }
    .registering .panel-footer { margin-top: 8px; padding-top: 7px; }
    @media (min-width: 1200px) and (min-height: 720px) {
      .auth-panel { padding: 38px 42px 31px; }
      .panel-head { margin-bottom: 27px; }
      .mode-title { font-size: 35px; }
      .form { gap: 16px; }
      .input { height: 52px; font-size: 14px; }
      .reveal { top: 9px; height: 34px; }
      .submit { height: 54px; font-size: 14px; }
      .message { min-height: 44px; font-size: 12px; }
      .registering .auth-panel { padding: 32px 42px 25px; }
      .registering .panel-head { margin-bottom: 17px; }
      .registering .form { gap: 11px; }
      .registering .input { height: 47px; }
      .registering .reveal { top: 8px; height: 31px; }
      .registering .submit { height: 48px; }
    }
    @media (max-width: 900px) {
      .brand-zone { display: none; }
      .auth-panel { right: auto; left: 50%; transform: translate(-50%, -50%); }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <main class="shell" id="shell" data-mode="login">
    <div class="drag-region" aria-hidden="true"></div>
    <section class="stage" id="stage">
      <div class="backdrop" aria-hidden="true"></div>
      <div class="scene-grade" aria-hidden="true"></div>

      <section class="brand-zone" aria-hidden="true">
        <div class="brand-lockup">
          <span class="brand-mark">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2-5 5-5-5"/><rect width="20" height="15" x="2" y="7" rx="2"/></svg>
          </span>
          <span class="brand-name">Freedom</span>
        </div>
        <p class="brand-tagline">小说 → 剧本 → 分镜 → 元素 → 出图 → 视频<br />一站式短剧流水线</p>
        <p class="brand-note">登录后即可开始创作。</p>
      </section>

      <section class="auth-panel">
        <div class="panel-head">
          <div><div class="panel-kicker">WELCOME / Freedom</div><h1 class="mode-title" id="modeTitle">欢迎回来</h1><div class="mode-copy" id="modeCopy">登录以继续你的创作之旅</div></div>
          <div class="tabs"><button class="tab active" id="loginTab" type="button">登录</button><button class="tab" id="registerTab" type="button">注册</button></div>
        </div>
        <form class="form" id="accountForm">
          <label class="field"><span class="field-line"><span class="field-label">用户名</span><span class="field-index">01 / USER</span></span><span class="input-wrap"><input class="input" id="username" maxlength="64" autocomplete="username" autocapitalize="off" spellcheck="false" placeholder="输入用户名" /></span></label>
          <label class="field"><span class="field-line"><span class="field-label">密码</span><span class="field-index">02 / PASS</span></span><span class="input-wrap"><input class="input password" id="password" type="password" minlength="5" maxlength="128" autocomplete="current-password" placeholder="至少 5 个字符" /><button class="reveal" id="revealPassword" type="button">显示</button></span></label>
          <label class="field hidden" id="confirmField"><span class="field-line"><span class="field-label">确认密码</span><span class="field-index">03 / VERIFY</span></span><span class="input-wrap"><input class="input password" id="confirmPassword" type="password" minlength="5" maxlength="128" autocomplete="new-password" placeholder="再次输入密码" /><button class="reveal" id="revealConfirm" type="button">显示</button></span></label>
          <div class="session-row"><span class="session-check">✓</span><span>此设备保持登录</span><span class="session-note">不保存密码</span></div>
          <button class="submit" id="submitBtn" type="submit">登 录</button>
          <div class="message" id="msg" role="status" aria-live="polite">正在检查账号状态...</div>
        </form>
        <footer class="panel-footer"><span>Freedom / ACCOUNT ACCESS</span><button class="update-action hidden" id="updateAction" type="button">检查更新</button><span class="footer-state" id="footerState">READY</span></footer>
      </section>
    </section>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    let mode = 'login';
    let updateState = null;
    let unsubscribeUpdate = null;

    function initMotion() {
      const stage = $('stage');
      const motionQuery = matchMedia('(prefers-reduced-motion: reduce)');
      if (!stage) return;
      let pointerFrame = 0;
      let pointerPosition = null;

      function resetPosition() {
        pointerPosition = null;
        stage.style.setProperty('--shift-x', '0px');
        stage.style.setProperty('--shift-y', '0px');
      }

      function handlePointerMove(event) {
        if (motionQuery.matches) return;
        pointerPosition = { x: event.clientX, y: event.clientY };
        if (pointerFrame) return;
        pointerFrame = requestAnimationFrame(() => {
          pointerFrame = 0;
          if (!pointerPosition) return;
          const rect = stage.getBoundingClientRect();
          const x = ((pointerPosition.x - rect.left) / rect.width - .5) * -4;
          const y = ((pointerPosition.y - rect.top) / rect.height - .5) * -3;
          stage.style.setProperty('--shift-x', `${x.toFixed(2)}px`);
          stage.style.setProperty('--shift-y', `${y.toFixed(2)}px`);
        });
      }

      function handleMotionPreference(event) {
        if (event.matches) resetPosition();
      }

      stage.addEventListener('pointermove', handlePointerMove);
      stage.addEventListener('pointerleave', resetPosition);
      motionQuery.addEventListener?.('change', handleMotionPreference);
      window.addEventListener('beforeunload', () => {
        cancelAnimationFrame(pointerFrame);
        stage.removeEventListener('pointermove', handlePointerMove);
        stage.removeEventListener('pointerleave', resetPosition);
        motionQuery.removeEventListener?.('change', handleMotionPreference);
      }, { once: true });
    }

    function showMsg(text, type = '') {
      $('msg').textContent = text;
      $('msg').className = `message ${type}`.trim();
    }

    function applyUpdateState(next) {
      if (!next || typeof next !== 'object') return;
      updateState = next;
      const action = $('updateAction');
      const footer = $('footerState');
      action.classList.toggle('hidden', !next.enabled);
      if (!next.enabled) { footer.textContent = 'READY'; return; }

      const version = next.targetVersion ? ` v${next.targetVersion}` : '';
      action.disabled = ['checking', 'downloading', 'installing'].includes(next.status);
      action.title = next.error || '';
      if (next.status === 'checking') action.textContent = '检查中';
      else if (next.status === 'available') action.textContent = `下载${version}`;
      else if (next.status === 'downloading') action.textContent = `下载 ${Math.round(Number(next.percent) || 0)}%`;
      else if (next.status === 'downloaded') action.textContent = '重启更新';
      else if (next.status === 'installing') action.textContent = '正在重启';
      else if (next.status === 'error' && next.updateAvailable) action.textContent = '重新下载';
      else if (next.status === 'error') action.textContent = '重试更新';
      else action.textContent = '检查更新';
      footer.textContent = next.status === 'available' || next.status === 'downloaded'
        ? `UPDATE${version}`
        : `v${next.currentVersion || '-'}`;
    }

    async function runUpdateAction() {
      if (!window.softwareUpdate || !updateState?.enabled) return;
      const action = $('updateAction');
      action.disabled = true;
      try {
        let next;
        if (updateState.status === 'downloaded') next = await window.softwareUpdate.install();
        else if (updateState.updateAvailable && ['available', 'error'].includes(updateState.status)) next = await window.softwareUpdate.download();
        else next = await window.softwareUpdate.check();
        applyUpdateState(next);
      } catch (error) {
        action.title = error?.message || '更新操作失败';
        action.textContent = '重试更新';
        action.disabled = false;
      }
    }

    async function initSoftwareUpdate() {
      if (!window.softwareUpdate) return;
      unsubscribeUpdate = window.softwareUpdate.onState?.(applyUpdateState) || null;
      try { applyUpdateState(await window.softwareUpdate.getState()); }
      catch { /* 登录功能不应被更新检查阻断 */ }
    }

    function setMode(next) {
      mode = next;
      const registering = next === 'register';
      $('shell').dataset.mode = next;
      $('shell').classList.toggle('registering', registering);
      $('loginTab').classList.toggle('active', next === 'login');
      $('registerTab').classList.toggle('active', registering);
      $('confirmField').classList.toggle('hidden', !registering);
      $('modeTitle').textContent = registering ? '创建账号' : '欢迎回来';
      $('modeCopy').textContent = registering ? '注册后等待管理员审核，通过即可登录' : '登录以继续你的创作之旅';
      $('submitBtn').textContent = registering ? '提 交 注 册' : '登 录';
      $('password').autocomplete = registering ? 'new-password' : 'current-password';
      showMsg(registering ? '提交后进入待审核列表，管理员通过后即可登录。' : '请输入已审核账号的用户名和密码。');
    }

    function togglePassword(inputId, buttonId) {
      const input = $(inputId);
      const visible = input.type === 'text';
      input.type = visible ? 'password' : 'text';
      $(buttonId).textContent = visible ? '显示' : '隐藏';
      input.focus();
    }

    async function init() {
      try {
        const status = await window.license.status();
        if (status?.error && status.code !== 'NO_LICENSE') showMsg(status.error, 'err');
        else showMsg('请输入已审核账号的用户名和密码。');
      } catch {
        showMsg('无法读取账号状态，请重启软件。', 'err');
      }
    }

    function setDisabled(value) {
      for (const id of ['username', 'password', 'confirmPassword', 'submitBtn', 'loginTab', 'registerTab', 'revealPassword', 'revealConfirm']) $(id).disabled = value;
    }

    async function submit() {
      const username = $('username').value.trim();
      const password = $('password').value;
      if (!username) { showMsg('请输入用户名。', 'err'); $('username').focus(); return; }
      if (password.length < 5) { showMsg('密码至少需要 5 个字符。', 'err'); $('password').focus(); return; }
      if (mode === 'register' && password !== $('confirmPassword').value) { showMsg('两次输入的密码不一致。', 'err'); $('confirmPassword').focus(); return; }
      setDisabled(true);
      showMsg(mode === 'register' ? '正在创建账号...' : '正在验证账号...');
      try {
        const credentials = { username, password };
        const result = mode === 'register'
          ? await window.license.register(credentials)
          : await window.license.login(credentials);
        if (!result?.ok) {
          setDisabled(false);
          if (result?.state === 'pending') {
            showMsg('注册成功，账号正在等待管理员审核。通过后即可登录。', 'ok');
          } else {
            showMsg(result?.error || '验证失败，请检查用户名和密码后重试。', 'err');
          }
          return;
        }
        // 成功后由主进程打开主界面并关闭本窗口。
        showMsg('验证成功，正在进入 Freedom...', 'ok');
      } catch (error) {
        setDisabled(false);
        showMsg(error?.message || '无法连接授权服务器，请检查网络后重试。', 'err');
      }
    }

    $('loginTab').addEventListener('click', () => setMode('login'));
    $('registerTab').addEventListener('click', () => setMode('register'));
    $('revealPassword').addEventListener('click', () => togglePassword('password', 'revealPassword'));
    $('revealConfirm').addEventListener('click', () => togglePassword('confirmPassword', 'revealConfirm'));
    $('accountForm').addEventListener('submit', (event) => { event.preventDefault(); submit(); });
    $('updateAction').addEventListener('click', runUpdateAction);
    initMotion();
    init();
    initSoftwareUpdate();
    window.addEventListener('beforeunload', () => unsubscribeUpdate?.(), { once: true });
  </script>
</body>
</html>
